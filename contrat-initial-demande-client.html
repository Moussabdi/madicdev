<!doctype html>

<html lang="fr-CA">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>Nouveau contrat initial | MADIC Portail</title>
    <link href="img/favicon.png" rel="icon" />
    <link href="assets/contrat-initial-demande-client.css" rel="stylesheet" />
  </head>
  <body>
    <a class="madic8-skip" href="#madic8-main">Aller au contenu principal</a>
    <header class="top madic-unified-header">
      <a
        data-en="← My space"
        data-fr="← Mon espace client"
        href="dashboard-client-cric.html"
        >← Mon espace client</a
      >
      <h1
        data-en="Initial consultation agreement - Client to RCIC"
        data-fr="Contrat de consultation initiale - Client vers CRIC"
      >
        Contrat de consultation initiale - Client vers CRIC
      </h1>
      <a class="brand" href="gestion-dossiers-cric.html"
        >MADIC<span
          class="brand-subtitle"
          data-en="Professional workspace"
          data-fr="Espace professionnel"
          >Espace professionnel</span
        ></a
      ><span data-en="Contracts" data-fr="Contrats">Contrats</span>
      <nav class="toplinks">
        <a
          data-en="Sign out"
          data-fr="Déconnexion"
          data-madic-signout="true"
          href="connexion-client-cric.html"
          id="madicHeaderSignout"
          >Déconnexion</a
        ><a
          data-en="My workspace"
          data-fr="Mon espace"
          href="dashboard-client-cric.html"
          >Mon espace</a
        >
      </nav>
      <div
        aria-label="Outils du compte"
        class="madic-hero-tools"
        data-aria-label-en="Account tools"
        data-aria-label-fr="Outils du compte"
      >
        <a
          aria-label="Notifications de messagerie"
          class="madic-hero-notifications"
          data-aria-label-en="Message notifications"
          data-aria-label-fr="Notifications de messagerie"
          data-title-en="Message notifications"
          data-title-fr="Notifications de messagerie"
          href="messagerie-client-cric.html"
          title="Notifications de messagerie"
          ><svg
            aria-hidden="true"
            fill="none"
            height="22"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.8"
            viewbox="0 0 24 24"
            width="22"
          >
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
            <path d="M10 21h4"></path>
          </svg>
          <span class="madic-hero-unread" hidden="" id="madicHeroUnread"
            >0</span
          ></a
        >
        <div
          aria-label="Langue du portail"
          class="madic-language-switch"
          data-aria-label-en="Portal language"
          data-aria-label-fr="Langue du portail"
          id="madicHeroLanguage"
        >
          <button aria-pressed="true" data-lang="fr" type="button">FR</button
          ><button aria-pressed="false" data-lang="en" type="button">EN</button>
        </div>
      </div>
    </header>
    <main id="madic8-main">
      <p data-en="Loading…" data-fr="Chargement…" id="status" role="status">
        Chargement…
      </p>
      <section class="panel" hidden="" id="workspace">
        <label
          ><span data-en="Case file" data-fr="Dossier">Dossier</span
          ><select id="dossier"></select
        ></label>
        <p id="tariff"></p>
        <p
          data-en="Carefully review both pages of the agreement before signing."
          data-fr="Vérifiez attentivement les deux pages du contrat avant de signer."
        >
          Vérifiez attentivement les deux pages du contrat avant de signer.
        </p>
        <iframe
          data-title-en="Agreement preview"
          data-title-fr="Aperçu du contrat"
          id="preview"
          sandbox="allow-same-origin"
          title="Aperçu du contrat"
        ></iframe>
        <form id="signForm">
          <h2 data-en="Client signature" data-fr="Signature du client">
            Signature du client
          </h2>
          <label
            ><span data-en="Full name" data-fr="Nom complet">Nom complet</span
            ><input id="fullName" maxlength="200" required="" /></label
          ><label
            ><span data-en="Initials" data-fr="Initiales">Initiales</span
            ><input id="initials" maxlength="12" required="" /></label
          ><label
            ><span data-en="City of signature" data-fr="Ville de signature"
              >Ville de signature</span
            ><input id="city" maxlength="120" required="" /></label
          ><label class="acceptance"
            ><input id="accept" required="" type="checkbox" /> J'ai lu le
            contrat et j'accepte sa signature électronique.</label
          ><button
            data-en="Sign and send to the RCIC"
            data-fr="Signer et transmettre au CRIC"
            id="submit"
            type="submit"
          >
            Signer et transmettre au CRIC
          </button>
        </form>
      </section>
    </main>
    <script defer="" src="assets/config.js"></script>
    <script defer="" src="assets/contrat-initial-demande-client.js"></script>
  </body>
</html>
