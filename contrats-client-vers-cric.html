<!doctype html>

<html lang="fr-CA">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title
      data-en="Contracts Signed by Clients | MADIC Portal"
      data-fr="Contrats signés par les clients | MADIC Portail"
    >
      Contrats signés par les clients | MADIC Portail
    </title>
    <link href="img/favicon.png" rel="icon" />

    <link href="assets/contrats-client-vers-cric.css" rel="stylesheet" />
  </head>
  <body>
    <a class="madic8-skip" href="#madic8-main">Aller au contenu principal</a>
    <header class="madic-page-header">
      <a data-i18n="back" href="gestion-dossiers-cric.html">← Espace CRIC</a>
      <h1 data-i18n="title">Contrats transmis par les clients</h1>
      <div
        aria-label="Language / Langue"
        class="madic-language-switch"
        role="group"
      >
        <button aria-pressed="true" data-lang="fr" type="button">FR</button
        ><button aria-pressed="false" data-lang="en" type="button">EN</button>
      </div>
    </header>
    <main id="madic8-main">
      <p data-i18n="loading" id="status" role="status">Chargement…</p>
      <div id="contracts"></div>
      <section class="panel" hidden="" id="detail">
        <h2 id="detailTitle"></h2>
        <iframe
          data-i18n-title="documentTitle"
          id="document"
          sandbox="allow-same-origin"
          title="Contrat signé"
        ></iframe>
        <div id="signArea">
          <label data-i18n-label="city"
            >Ville de signature du CRIC
            <input id="city" maxlength="120" /></label
          ><label data-i18n-label="consent"
            ><input id="accept" type="checkbox" /> Je confirme ma signature
            électronique de ce contrat.</label
          ><button data-i18n="sign" id="sign">Contresigner le contrat</button>
        </div>
        <button data-i18n="archive" hidden="" id="archive">
          Archiver le PDF final</button
        ><button data-i18n="openPdf" hidden="" id="openPdf">
          Ouvrir le PDF archivé</button
        ><button data-i18n="print" id="print">Imprimer / PDF</button>
      </section>
    </main>

    <script defer="True" src="assets/contrats-client-vers-cric.js"></script>
  </body>
</html>
