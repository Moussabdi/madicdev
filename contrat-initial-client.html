<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Contrat de consultation initiale | MADIC Portail</title>
    <link rel="icon" href="img/favicon.png" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f6f8;
        color: #1c2c3d;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      header {
        background: #102c43;
        color: white;
        padding: 18px max(20px, calc((100vw - 1100px) / 2));
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      header a {
        color: white;
      }
      main {
        max-width: 1100px;
        margin: 24px auto;
        padding: 0 18px;
      }
      h1 {
        font-size: 1.7rem;
      }
      .initial-document-frame {
        display: block;
        width: 100%;
        min-height: 1700px;
        border: 1px solid #d9e0e6;
        background: white;
      }
      .action {
        border: 0;
        background: #154a6b;
        color: white;
        border-radius: 6px;
        padding: 12px 17px;
        cursor: pointer;
        margin: 16px 0;
      }
      .initial-sign-form {
        background: white;
        padding: 24px;
        margin: 24px 0;
        border: 1px solid #d9e0e6;
        border-radius: 10px;
        max-width: 650px;
      }
      .initial-sign-form label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 12px 0;
      }
      .initial-sign-form input:not([type="checkbox"]) {
        padding: 10px;
        border: 1px solid #bac6cf;
        border-radius: 5px;
      }
      .initial-sign-form .accept {
        flex-direction: row;
        align-items: start;
      }
      @media print {
        header,
        h1,
        #initial-view-status,
        .action,
        .initial-sign-form {
          display: none !important;
        }
        main {
          padding: 0;
          margin: 0;
          max-width: none;
        }
        .initial-document-frame {
          border: 0;
        }
      }
    
/* Accessibilite du portail client - styles locaux, sans nouvelle dependance. */
.madic8-skip{position:absolute;left:12px;top:-100px;z-index:99999;padding:12px 18px;background:#fff;color:#092138;border-radius:8px;font-weight:700;text-decoration:none}
.madic8-skip:focus,.madic8-skip:focus-visible{top:12px}
body:has(> .madic8-skip) :where(button,a,input,select,textarea,[tabindex]):focus-visible{outline:3px solid #7ee6f2;outline-offset:3px}
body:has(> .madic8-skip) :where(img,svg,video,iframe){max-width:100%}
@media(max-width:760px){body:has(> .madic8-skip) :where(.panel,.card,main,.wrap){min-width:0;max-width:100%}}
@media(prefers-reduced-motion:reduce){body:has(> .madic8-skip) *,body:has(> .madic8-skip) *::before,body:has(> .madic8-skip) *::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}}
@media print{.madic8-skip{display:none!important}}

</style>
  </head>
  <body>
    <a class="madic8-skip" href="#madic8-main">Aller au contenu principal</a>
    <header>
      <strong>MADIC PORTAIL · Espace client</strong
      ><a href="mes-contrats.html">← Mes contrats</a>
    </header>
    <main id="madic8-main">
      <h1>Contrat de consultation initiale</h1>
      <p id="initial-view-status" role="status">Chargement de votre contrat…</p>
      <div id="initial-view-content"></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="assets/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="assets/madic-initial-viewer.js"></script>
  </body>
</html>
